<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line Watch</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#262d36; --ink:#e6edf3;
    --dim:#8b949e; --up:#3fb950; --down:#f85149; --warn:#d29922;
    --accent:#58a6ff;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#ffffff; --panel:#f6f8fa; --line:#d8dee4; --ink:#1f2328;
      --dim:#59636e; --up:#1a7f37; --down:#cf222e; --warn:#9a6700;
      --accent:#0969da;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;
    border-bottom:1px solid var(--line);padding-bottom:10px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px;
    white-space:nowrap}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .n{color:var(--dim);margin-left:6px;font-size:11px}
  .tab.on .n{color:rgba(255,255,255,.8)}
  .tab.top{border-color:var(--accent);font-weight:600}
  .rank{display:inline-block;min-width:1.6em;color:var(--dim);
    font-variant-numeric:tabular-nums}
  .norm{color:var(--accent);font-weight:600;font-size:12px}
  .toprow .row{padding-top:2px}
  .tab.untracked{opacity:.62}
  .tab.untracked .n{font-style:italic}
  .ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    margin:0 0 16px;font-size:13px;color:var(--dim)}
  .ctl label{display:flex;gap:6px;align-items:center}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font-size:13px}
  .game{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:10px}
  .ghead{display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .teams{font-weight:600}
  .when{color:var(--dim);font-size:12px}
  .mkts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:10px}
  .mkt{border:1px solid var(--line);border-radius:8px;padding:10px 11px}
  .mkt h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--dim);font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:center;
    gap:10px;padding:3px 0;font-variant-numeric:tabular-nums;font-size:13px}
  .side{color:var(--dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .nums{display:flex;gap:8px;align-items:center;white-space:nowrap}
  .was{color:var(--dim);font-size:12px}
  .mv{font-size:12px;font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  .flags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .flag{font-size:11.5px;padding:3px 8px;border-radius:999px;
    border:1px solid var(--line);color:var(--dim)}
  .flag.steam{border-color:var(--accent);color:var(--accent)}
  .flag.key{border-color:var(--warn);color:var(--warn)}
  .flag.outlier{border-color:var(--up);color:var(--up)}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-top:26px;color:var(--dim);font-size:13px}
  .note b{color:var(--ink)}
  .empty{color:var(--dim);padding:28px 4px;text-align:center}
  svg.spark{display:block;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Line Watch</h1>
  <p class="sub" id="sub">Loading…</p>

  <div class="tabs" id="tabs"></div>

  <div class="ctl">
    <span id="ctl-normal" style="display:contents">
    <label>Show
      <select id="filter">
        <option value="all">every game</option>
        <option value="flagged" selected>only games with something flagged</option>
        <option value="tracked">only games whose lines are being watched</option>
      </select>
    </label>
    <label>Order by
      <select id="order">
        <option value="start">start time</option>
        <option value="move">biggest move</option>
        <option value="flags">most flags</option>
      </select>
    </label>
    </span>
    <span id="count"></span>
  </div>

  <div id="board"></div>

  <div class="note" id="note"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has = v => v !== null && v !== undefined && v === v;

let INDEX = null, SPORT = null, DATA = null;

// Market order is fixed rather than whatever the JSON happens to list, so the
// same market sits in the same place on every card and the eye can scan down.
const MARKET_ORDER = ["spreads", "totals", "h2h"];
const MARKET_NAME = {spreads: "Spread", totals: "Total", h2h: "Moneyline"};

// A moneyline is a price and a spread is a number of points. Printing -3.5
// and -150 with the same formatter makes a half-point look like a price and a
// price look like a line.
function fmtVal(market, v){
  if (!has(v)) return "—";
  if (market === "h2h") return (v > 0 ? "+" : "") + Math.round(v);
  return (v > 0 ? "+" : "") + (Math.round(v * 2) / 2).toFixed(1);
}
function fmtMove(market, v){
  if (!has(v) || v === 0) return {txt: "no move", cls: "flat"};
  const s = market === "h2h" ? Math.round(v) : (Math.round(v * 2) / 2).toFixed(1);
  return {txt: (v > 0 ? "+" : "") + s, cls: v > 0 ? "up" : "down"};
}
function when(iso){
  if (!iso) return "";
  const t = new Date(iso);
  if (isNaN(t)) return "";
  const mins = Math.round((t - Date.now()) / 60000);
  const clock = t.toLocaleString(undefined,
    {weekday:"short", hour:"numeric", minute:"2-digit"});
  if (mins < 0) return clock + " · in progress or done";
  if (mins < 60) return clock + ` · in ${mins}m`;
  if (mins < 60 * 36) return clock + ` · in ${Math.round(mins/60)}h`;
  return clock;
}

// The sparkline. Deliberately unlabelled and deliberately small: it is there
// to show the SHAPE of the move - one jump, a steady drift, a round trip -
// next to the numbers that already say how far it went. A chart with axes
// would be a bigger claim than this data supports.
function spark(series, market){
  if (!series || series.length < 2) return "";
  const vals = series.map(p => p[1]).filter(has);
  if (vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const W = 190, H = 26, pad = 2;
  const span = (hi - lo) || 1;
  const pts = vals.map((v, i) => {
    const x = pad + (W - 2 * pad) * (i / (vals.length - 1));
    const y = H - pad - (H - 2 * pad) * ((v - lo) / span);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const rising = vals[vals.length - 1] >= vals[0];
  const col = rising ? "var(--up)" : "var(--down)";
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
    role="img" aria-label="line history, ${esc(fmtVal(market, vals[0]))} to
    ${esc(fmtVal(market, vals[vals.length-1]))}">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function marketCard(market, sides){
  const names = Object.keys(sides);
  if (!names.length) return "";
  const rows = names.map(n => {
    const d = sides[n], mv = fmtMove(market, d.move);
    return `<div class="row">
        <span class="side" title="${esc(n)}">${esc(n)}</span>
        <span class="nums">
          <span class="was" title="the first line this site saw, not the
            book's opener">${esc(fmtVal(market, d.first))}</span>
          <span>→</span>
          <b>${esc(fmtVal(market, d.now))}</b>
          <span class="mv ${mv.cls}">${esc(mv.txt)}</span>
        </span>
      </div>`;
  }).join("");
  const first = sides[names[0]];
  return `<div class="mkt"><h4>${esc(MARKET_NAME[market] || market)}</h4>
    ${rows}${spark(first.series, market)}</div>`;
}

function gameCard(g){
  const mkts = MARKET_ORDER.filter(m => g.lines && g.lines[m])
    .map(m => marketCard(m, g.lines[m])).join("");
  const flags = (g.flags || []).map(f =>
    `<span class="flag ${esc(f.kind)}">${esc(f.text)}</span>`).join("");
  return `<div class="game">
      <div class="ghead">
        <span class="teams">${esc(g.away)} @ ${esc(g.home)}</span>
        <span class="when">${esc(when(g.start))}</span>
      </div>
      ${mkts ? `<div class="mkts">${mkts}</div>`
             : `<div class="when">No line history yet — this game's odds have
                not been polled. It is on the schedule either way.</div>`}
      ${flags ? `<div class="flags">${flags}</div>` : ""}
    </div>`;
}

function biggestMove(g){
  let best = 0;
  for (const m of Object.keys(g.lines || {})){
    for (const s of Object.keys(g.lines[m])){
      const v = g.lines[m][s].move;
      // Scaled, because ten cents of moneyline and ten points of spread are
      // not the same size of event and sorting them together unscaled would
      // put every moneyline above every spread.
      const scale = m === "h2h" ? 0.05 : 1;
      if (has(v)) best = Math.max(best, Math.abs(v) * scale);
    }
  }
  return best;
}

function draw(){
  if (!DATA) return;
  const f = $("filter").value, o = $("order").value;
  let games = (DATA.games || []).slice();
  if (f === "flagged") games = games.filter(g => (g.flags || []).length);
  if (f === "tracked") games = games.filter(g => g.tracked);
  if (o === "move") games.sort((a, b) => biggestMove(b) - biggestMove(a));
  else if (o === "flags")
    games.sort((a, b) => (b.flags || []).length - (a.flags || []).length);
  else games.sort((a, b) => String(a.start || "").localeCompare(String(b.start || "")));

  $("count").textContent =
    `${games.length} of ${(DATA.games || []).length} games`;
  if (games.length) { $("board").innerHTML = games.map(gameCard).join(""); return; }
  // AN EMPTY BOARD HAS TO SAY WHY. "Nothing matches that filter" is true and
  // useless when the real reason is that this sport has a schedule and no
  // odds, which is a budget setting rather than a fault.
  const total = (DATA.games || []).length;
  const tracked = (DATA.games || []).filter(g => g.tracked).length;
  $("board").innerHTML = `<div class="empty">${
    !total ? "No games on the board for this sport right now."
    : !tracked
      ? `<b>${total} games on the schedule, none being watched yet.</b><br><br>
         The schedule comes from a free endpoint, so every sport appears here.
         Odds cost credits, and the budget went to the sports closest to
         starting. Raise <code>MONTHLY_CREDITS</code> in <code>config.py</code>,
         or raise this sport's <code>priority</code>, to have it watched.`
    : `Nothing matches that filter. ${tracked} of ${total} games here have line
       history — try <b>every game</b>.`}</div>`;
}

// ---------------------------------------------------------------- TOP MOVES
// One ranked list across every sport, for the day.
//
// THE HARD PART IS THE SCALE, not the sorting. A 1.0 move is enormous on a
// point spread and routine on a moneyline price - measured on a real board,
// the 90th-percentile NCAAF spread move was 0.5 points while the 90th
// percentile h2h move was 25 cents. Ranking raw size across sports would
// produce a moneyline leaderboard and nothing else.
//
// So every move is divided by what a move NORMALLY is for that sport and
// market, worked out from the board's own data. The number you sort on is
// "how many typical moves is this", which compares across sports because the
// units cancel.
//
// WHAT THIS IS NOT: a prediction. It ranks by how UNUSUAL a move is, and
// nobody has yet measured whether unusual moves predict anything - that is
// what grade.py is for. Read it as "where did the market do something odd
// today", not "where is the bet".
// A MONEYLINE IS SCORED IN PROBABILITY, NOT IN CENTS. This matters more than
// anything else here. A price going -2000 to -2500 is five hundred cents and
// nine tenths of one percentage point of probability; -110 to -160 is fifty
// cents and NINE points. Ranking by cents put a parade of enormous favourites
// at the top of this list and buried every meaningful move - the first build
// of this tab had seven moneylines in its top eight and covered two sports.
//
// Converting to implied probability makes moneyline moves comparable with
// each other, which is the whole job.
function impliedProb(american){
  if (!Number.isFinite(american) || american === 0) return null;
  return american < 0 ? (-american) / ((-american) + 100)
                      : 100 / (american + 100);
}

// How much a line moved, in units that mean the same thing within a market:
// points for a spread or total, PERCENTAGE POINTS OF PROBABILITY for a price.
function moveSize(market, first, now){
  if (!has(first) || !has(now)) return null;
  if (market !== "h2h") return now - first;
  const a = impliedProb(first), b = impliedProb(now);
  return (a === null || b === null) ? null : (b - a) * 100;
}

// Fallbacks for when a market has too few moves to calibrate itself. h2h is
// in probability points now, so 2 points - not 10 cents.
const FALLBACK_SCALE = {spreads: 0.5, totals: 0.5, h2h: 2};

function scaleFor(moves, market){
  // The typical NON-ZERO move. Zeros are most of the board - lines that have
  // not moved - and including them would drag the scale toward nothing and
  // make every small move look enormous.
  const nz = moves.filter(v => Number.isFinite(v) && Math.abs(v) > 0)
                  .map(Math.abs).sort((a,b) => a - b);
  const fall = FALLBACK_SCALE[market] || 1;
  if (nz.length < 6) return fall;          // too thin to calibrate
  const med = nz[Math.floor(nz.length / 2)];
  // Never let the scale collapse below the fallback, or one quiet sport
  // sends its own rounding noise to the top of the list.
  return Math.max(med, fall);
}

function rankMoves(bySport){
  // Pool every move by sport+market to work out the scales.
  const pool = {};
  for (const [key, data] of Object.entries(bySport)){
    for (const g of data.games || []){
      for (const [mk, sides] of Object.entries(g.lines || {})){
        for (const v of Object.values(sides)){
          const d = moveSize(mk, v.first, v.now);
          if (d === null) continue;
          (pool[key + "|" + mk] = pool[key + "|" + mk] || []).push(d);
        }
      }
    }
  }
  const scales = {};
  for (const [k, vals] of Object.entries(pool))
    scales[k] = scaleFor(vals, k.split("|")[1]);

  const rows = [];
  for (const [key, data] of Object.entries(bySport)){
    for (const g of data.games || []){
      for (const [mk, sides] of Object.entries(g.lines || {})){
        for (const [side, v] of Object.entries(sides)){
          const d = moveSize(mk, v.first, v.now);
          if (d === null || d === 0) continue;
          const sc = scales[key + "|" + mk] || FALLBACK_SCALE[mk] || 1;
          const norm = Math.abs(d) / sc;
          // Book agreement is a TIE-BREAK, not a multiplier.
          //
          // It was a multiplier at first, and that made the list look broken:
          // the page sorts on one number and showed another, so a 3.0x row
          // with six books sat above a 3.5x row with three and the ordering
          // read as a bug. Whatever number is printed has to be the number
          // that sorted the list.
          rows.push({
            sport: data.title || key, key, game: g, market: mk, side,
            first: v.first, now: v.now, move: v.move, sized: d,
            books: v.books,
            norm,
            flags: (g.flags || []).filter(f =>
              f.text && f.text.includes(mk)),
          });
        }
      }
    }
  }
  // Sorted on exactly the figure the row displays, with book agreement
  // only separating ties.
  rows.sort((a, b) => (b.norm - a.norm) || ((b.books || 0) - (a.books || 0)));
  // ONE ROW PER GAME AND MARKET. Both sides of a total move together and the
  // two sides of a spread are mirror images, so every line produced two
  // near-identical rows and a single game could occupy four of the top eight
  // places. Keeping the best-scoring side halves the list and lets other
  // games onto it.
  const seen = new Set();
  return rows.filter(r => {
    const k = r.key + "|" + (r.game.id || "") + "|" + r.market;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

function topRow(r, i){
  const mv = fmtMove(r.market, r.move);
  const fl = r.flags.slice(0, 3).map(f =>
    `<span class="flag ${esc(f.kind)}">${esc(f.kind)}</span>`).join("");
  return `<div class="game toprow">
      <div class="ghead">
        <span class="teams"><span class="rank">${i + 1}</span>
          ${esc(r.game.away)} @ ${esc(r.game.home)}</span>
        <span class="when">${esc(r.sport)} · ${esc(when(r.game.start))}</span>
      </div>
      <div class="row">
        <span class="side">${esc(MARKET_NAME[r.market] || r.market)}
          — ${esc(r.side)}</span>
        <span class="nums">
          <span class="was">${esc(fmtVal(r.market, r.first))}</span>
          <span>→</span><b>${esc(fmtVal(r.market, r.now))}</b>
          <span class="mv ${mv.cls}">${esc(mv.txt)}</span>
          ${r.market === "h2h"
            ? `<span class="was" title="the move in implied probability, which
                is what a price change actually means">${
                r.sized > 0 ? "+" : ""}${r.sized.toFixed(1)}pts</span>` : ""}
          <span class="norm" title="how many typical moves for this sport and
            market — the number the list is sorted by">${r.norm.toFixed(1)}x</span>
        </span>
      </div>
      ${fl ? `<div class="flags">${fl}
        <span class="flag">${r.books || "?"} books</span></div>` : ""}
    </div>`;
}

let TOPCACHE = null;
async function loadTop(){
  for (const el of document.querySelectorAll(".tab"))
    el.classList.toggle("on", el.dataset.key === "__top");
  $("ctl-normal").hidden = true;
  $("board").innerHTML = `<div class="empty">Reading every sport…</div>`;
  if (!TOPCACHE){
    const sports = (INDEX.sports || []).filter(s => s.tracked);
    const got = await Promise.all(sports.map(async s => {
      try {
        const r = await fetch(s.file + "?" + Date.now());
        return r.ok ? [s.key, await r.json()] : null;
      } catch (e) { return null; }
    }));
    TOPCACHE = Object.fromEntries(got.filter(Boolean));
  }
  const rows = rankMoves(TOPCACHE);
  $("count").textContent = `${rows.length} moves across `
    + `${Object.keys(TOPCACHE).length} sports`;
  $("board").innerHTML = rows.length
    ? `<div class="note" style="margin:0 0 14px">
         <b>Ranked by how unusual the move is, not by whether it predicts
         anything.</b> Each move is divided by what a move normally is for
         that sport and market — the <b>x</b> figure — because a point is
         enormous on a spread and nothing on a price. Nothing here has been
         graded yet; <code>grade.py</code> is what will say whether any of it
         is worth acting on.
       </div>` + rows.slice(0, 40).map(topRow).join("")
    : `<div class="empty">No line has moved yet. Come back after the next
       pass — a first sighting has nothing to compare against.</div>`;
}

async function loadSport(key){
  SPORT = key;
  $("ctl-normal").hidden = false;
  for (const el of document.querySelectorAll(".tab"))
    el.classList.toggle("on", el.dataset.key === key);
  const row = (INDEX.sports || []).find(s => s.key === key);
  try {
    const r = await fetch(row.file + "?" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
  } catch (e) {
    // A failed load has to SAY so. Left unhandled this is a blank board and
    // an unhandled rejection in a console nobody has open.
    $("board").innerHTML =
      `<div class="empty">Could not load ${esc(row.file)} (${esc(e.message)}).
       If the collector has just run, give the page a minute to redeploy.</div>`;
    return;
  }
  draw();
}

async function boot(){
  try {
    INDEX = await (await fetch("data/index.json?" + Date.now())).json();
  } catch (e) {
    $("sub").textContent =
      "No data published yet. Run the Watch workflow in Actions.";
    return;
  }
  const sports = INDEX.sports || [];
  if (!sports.length){
    $("sub").textContent = "No sports have games on the board right now.";
    return;
  }
  $("sub").textContent =
    "Line movement only — no model, no projections. Updated "
    + new Date(INDEX.updated).toLocaleString();
  // The count says what is WATCHED, not just what exists. A tab reading
  // "0/46" next to one reading "49/66" is the difference between a sport the
  // budget is tracking and one it is only listing, and that distinction is
  // the single most confusing thing about running this on a small plan.
  // The cross-sport tab is pinned first and is not a sport, so it carries no
  // tracked/flagged count - those are per-sport ideas.
  $("tabs").innerHTML = `<button class="tab top" data-key="__top">Top moves
      <span class="n">all sports</span></button>` + sports.map(s =>
    `<button class="tab${s.tracked ? "" : " untracked"}" data-key="${esc(s.key)}"
      title="${s.tracked ? `${s.tracked} of ${s.games} games have line history`
                         : "schedule only - the budget has not bought this sport's odds"}"
      >${esc(s.title)}
      <span class="n">${s.tracked ? (s.flagged || 0) + "/" + s.games
                                  : "schedule"}</span></button>`).join("");
  for (const el of document.querySelectorAll(".tab"))
    el.onclick = () => (el.dataset.key === "__top" ? loadTop()
                                                  : loadSport(el.dataset.key));
  $("filter").onchange = draw;
  $("order").onchange = draw;
  // Opens on the cross-sport list, because "what moved today" is the
  // question the page exists to answer; a single sport is the follow-up.
  await loadTop();
}

$("note").innerHTML = `
  <b>What this is.</b> Every game on the board, and what its line has done
  since this site first saw it. There is no model here and nothing is
  predicted — each flag says what the market <i>did</i>, never what it will do.
  <br><br>
  <b>What it cannot see, and this is the important one.</b> Reverse line
  movement — the line moving against where the public money is — is what most
  people mean by an interesting move. It needs ticket and handle percentages,
  and the odds feed behind this page does not carry them. Nothing here is
  reverse line movement. A <span class="flag steam">steam</span> flag means
  several books moved the same way quickly; whether the money behind it was
  sharp is not visible from prices alone, and anyone telling you otherwise
  from this data is guessing.
  <br><br>
  <b>"First seen" is not the opening line.</b> The true opener is whatever was
  hung before this site was watching. Buying it costs ten times a normal call,
  so the first number here is the first one this project caught — which is why
  it is labelled that way rather than called an open.
  <br><br>
  <b>The flags.</b>
  <span class="flag steam">steam</span> several books moving the same
  direction inside the hour.
  <span class="flag key">key number</span> a spread or total crossing a number
  games actually land on — real in football, where margins pile up on 3 and 7,
  and much weaker everywhere else.
  <span class="flag outlier">outlier</span> one book sitting off the
  consensus, which is the only flag here that is a bet rather than an
  observation; usually it means that book is slow.
  <span class="flag">frozen</span> a line that has not moved while the board
  around it has.
  <span class="flag">move</span> the distance from first seen to now.
  <br><br>
  <b>Not every game is watched.</b> The schedule comes from a free endpoint,
  so every game in every sport appears. Odds cost credits, so a game with no
  line history simply has not been polled — the budget went to games closer to
  starting. That is a setting, not a failure.`;

boot();
</script>
